<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title description"><title id="title">Mayura homepage content architecture</title><desc id="description">The homepage is arranged around identity and visit information, with menu exploration and restaurant context supporting the directions action.</desc><rect width="1200" height="450" rx="24" fill="#F8F8F6"/><text x="40" y="56" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="17" font-weight="750" fill="#315CFF">INFORMATION ARCHITECTURE</text><text x="40" y="89" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="23" font-weight="750" fill="#17191C">Content structure prioritised by the visit goal</text><rect x="442" y="115" width="316" height="70" rx="14" fill="#315CFF" stroke="#315CFF" stroke-width="1.5"/><text x="600" y="147" text-anchor="middle" font-family="Inter,Manrope,Arial,sans-serif" font-size="20" font-weight="750" fill="#fff">Homepage</text><text x="600" y="172" text-anchor="middle" font-family="Inter,Manrope,Arial,sans-serif" font-size="13" font-weight="450" fill="#eaf0ff">Mayura Cafe &amp; Food Court</text><path d="M600 185 L600 215" stroke="#315CFF" stroke-width="2.5" fill="none"/><path d="M162 215 L1038 215" stroke="#315CFF" stroke-width="2.5" fill="none"/><path d="M162 215 L162 242" stroke="#315CFF" stroke-width="2.5" fill="none"/><rect x="34" y="243" width="265" height="139" rx="14" fill="#fff" stroke="#DCE3EF" stroke-width="1.5"/><text x="52" y="274" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="17" font-weight="750" fill="#17191C">Restaurant identity</text><text x="52" y="307" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="13" font-weight="450" fill="#5E687A">Name · Neighbourhood</text><text x="52" y="329" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="13" font-weight="450" fill="#5E687A">Storefront context</text><text x="52" y="359" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="11" font-weight="750" fill="#315CFF">RECOGNISE</text><path d="M451 215 L451 242" stroke="#315CFF" stroke-width="2.5" fill="none"/><rect x="323" y="243" width="265" height="139" rx="14" fill="#fff" stroke="#DCE3EF" stroke-width="1.5"/><text x="341" y="274" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="17" font-weight="750" fill="#17191C">Visit information</text><text x="341" y="307" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="13" font-weight="450" fill="#5E687A">Verified address · Hours</text><text x="341" y="329" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="13" font-weight="450" fill="#5E687A">Nearby landmark</text><text x="341" y="359" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="11" font-weight="750" fill="#315CFF">PLAN</text><path d="M740 215 L740 242" stroke="#315CFF" stroke-width="2.5" fill="none"/><rect x="612" y="243" width="265" height="139" rx="14" fill="#fff" stroke="#DCE3EF" stroke-width="1.5"/><text x="630" y="274" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="17" font-weight="750" fill="#17191C">Menu exploration</text><text x="630" y="307" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="13" font-weight="450" fill="#5E687A">Food category controls</text><text x="630" y="329" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="13" font-weight="450" fill="#5E687A">Editable text + prices</text><text x="630" y="359" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="11" font-weight="750" fill="#315CFF">EXPLORE</text><path d="M1029 215 L1029 242" stroke="#315CFF" stroke-width="2.5" fill="none"/><rect x="901" y="243" width="265" height="139" rx="14" fill="#EDF2FF" stroke="#91A9FF" stroke-width="1.5"/><text x="919" y="274" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="17" font-weight="750" fill="#17191C">Directions action</text><text x="919" y="307" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="13" font-weight="450" fill="#5E687A">Confirmed Maps location</text><text x="919" y="329" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="13" font-weight="450" fill="#5E687A">Same CTA across page</text><text x="919" y="359" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="11" font-weight="750" fill="#315CFF">ACT</text><text x="42" y="420" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="12" font-weight="450" fill="#5E687A">These are homepage sections and interactions; the diagram does not claim unverified secondary pages are complete.</text></svg>