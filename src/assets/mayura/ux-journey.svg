<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title description"><title id="title">Proposed visit-first customer journey</title><desc id="description">Five hypothetical journey stages: discover the restaurant, recognise it, check visit information, open directions, and arrive. This is not validated customer research.</desc><rect width="1200" height="390" rx="24" fill="#F8F8F6"/><text x="44" y="56" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="17" font-weight="750" fill="#315CFF">PROPOSED CUSTOMER JOURNEY</text><text x="44" y="86" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="23" font-weight="750" fill="#17191C">From online discovery to a possible in-person visit</text><rect x="32" y="124" width="220" height="210" rx="14" fill="#FFFFFF" stroke="#DCE3EF" stroke-width="1.5"/><text x="50" y="161" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="18" font-weight="750" fill="#17191C">01  Discover</text><text x="50" y="199" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="14" font-weight="450" fill="#5E687A">Search or shared link</text><text x="50" y="226" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="13" font-weight="450" fill="#5E687A">“Is this the right café?”</text><rect x="50" y="265" width="184" height="32" rx="16" fill="#F2F4F8" stroke="#E3E7EF" stroke-width="1.5"/><text x="142" y="286" text-anchor="middle" font-family="Inter,Manrope,Arial,sans-serif" font-size="11" font-weight="750" fill="#172F78">ENTRY POINT</text><path d="M253 229 L266 229" stroke="#315CFF" stroke-width="2.5" fill="none"/><path d="M260 223 L266 229 L260 235" fill="none" stroke="#315CFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="267" y="124" width="220" height="210" rx="14" fill="#FFFFFF" stroke="#DCE3EF" stroke-width="1.5"/><text x="285" y="161" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="18" font-weight="750" fill="#17191C">02  Recognise</text><text x="285" y="199" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="14" font-weight="450" fill="#5E687A">See food and storefront</text><text x="285" y="226" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="13" font-weight="450" fill="#5E687A">“Does this look familiar?”</text><rect x="285" y="265" width="184" height="32" rx="16" fill="#F2F4F8" stroke="#E3E7EF" stroke-width="1.5"/><text x="377" y="286" text-anchor="middle" font-family="Inter,Manrope,Arial,sans-serif" font-size="11" font-weight="750" fill="#172F78">CONFIDENCE</text><path d="M488 229 L501 229" stroke="#315CFF" stroke-width="2.5" fill="none"/><path d="M495 223 L501 229 L495 235" fill="none" stroke="#315CFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="502" y="124" width="220" height="210" rx="14" fill="#FFFFFF" stroke="#DCE3EF" stroke-width="1.5"/><text x="520" y="161" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="18" font-weight="750" fill="#17191C">03  Plan visit</text><text x="520" y="199" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="14" font-weight="450" fill="#5E687A">Check address and hours</text><text x="520" y="226" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="13" font-weight="450" fill="#5E687A">“When can I go?”</text><rect x="520" y="265" width="184" height="32" rx="16" fill="#F2F4F8" stroke="#E3E7EF" stroke-width="1.5"/><text x="612" y="286" text-anchor="middle" font-family="Inter,Manrope,Arial,sans-serif" font-size="11" font-weight="750" fill="#172F78">READY TO VISIT</text><path d="M723 229 L736 229" stroke="#315CFF" stroke-width="2.5" fill="none"/><path d="M730 223 L736 229 L730 235" fill="none" stroke="#315CFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="737" y="124" width="220" height="210" rx="14" fill="#EDF2FF" stroke="#9DB2FF" stroke-width="1.5"/><text x="755" y="161" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="18" font-weight="750" fill="#17191C">04  Navigate</text><text x="755" y="199" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="14" font-weight="450" fill="#5E687A">Tap Get Directions</text><text x="755" y="226" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="13" font-weight="450" fill="#5E687A">“Take me there.”</text><rect x="755" y="265" width="184" height="32" rx="16" fill="#315CFF" stroke="#315CFF" stroke-width="1.5"/><text x="847" y="286" text-anchor="middle" font-family="Inter,Manrope,Arial,sans-serif" font-size="11" font-weight="750" fill="#fff">PRIMARY CTA</text><path d="M958 229 L971 229" stroke="#315CFF" stroke-width="2.5" fill="none"/><path d="M965 223 L971 229 L965 235" fill="none" stroke="#315CFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="972" y="124" width="220" height="210" rx="14" fill="#FFFFFF" stroke="#DCE3EF" stroke-width="1.5"/><text x="990" y="161" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="18" font-weight="750" fill="#17191C">05  Arrive</text><text x="990" y="199" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="14" font-weight="450" fill="#5E687A">Follow Google Maps</text><text x="990" y="226" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="13" font-weight="450" fill="#5E687A">Outside website scope</text><rect x="990" y="265" width="184" height="32" rx="16" fill="#F2F4F8" stroke="#E3E7EF" stroke-width="1.5"/><text x="1082" y="286" text-anchor="middle" font-family="Inter,Manrope,Arial,sans-serif" font-size="11" font-weight="750" fill="#172F78">NOT MEASURED</text><text x="44" y="367" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="12" font-weight="450" fill="#5E687A">Design hypothesis based on stakeholder inputs · Actual customer behaviour has not been studied.</text></svg>