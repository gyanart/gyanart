<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img" aria-labelledby="title description"><title id="title">Proposed homepage task flow</title><desc id="description">Starting on the Mayura homepage, people may need visit details immediately or browse the menu before opening directions. The intended task ends when Google Maps opens.</desc><rect width="1200" height="515" rx="24" fill="#F8F8F6"/><text x="44" y="54" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="17" font-weight="750" fill="#315CFF">USER FLOW · PROPOSED NAVIGATION TASK</text><text x="44" y="85" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="24" font-weight="750" fill="#17191C">One primary action, two reasonable paths</text><rect x="34" y="192" width="168" height="82" rx="14" fill="#FFFFFF" stroke="#DCE3EF" stroke-width="1.5"/><text x="118" y="225" text-anchor="middle" font-family="Inter,Manrope,Arial,sans-serif" font-size="17" font-weight="750" fill="#17191C">Arrive on</text><text x="118" y="248" text-anchor="middle" font-family="Inter,Manrope,Arial,sans-serif" font-size="17" font-weight="750" fill="#17191C">homepage</text><path d="M203 232 L265 232" stroke="#315CFF" stroke-width="2.5" fill="none"/><path d="M259 226 L265 232 L259 238" fill="none" stroke="#315CFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="355,168 444,232 355,296 266,232" fill="#EDF2FF" stroke="#9DB2FF" stroke-width="2"/><text x="355" y="221" text-anchor="middle" font-family="Inter,Manrope,Arial,sans-serif" font-size="15" font-weight="750" fill="#17191C">Need location</text><text x="355" y="242" text-anchor="middle" font-family="Inter,Manrope,Arial,sans-serif" font-size="15" font-weight="750" fill="#17191C">now?</text><path d="M444 232 L527 232" stroke="#315CFF" stroke-width="2.5" fill="none"/><path d="M521 226 L527 232 L521 238" fill="none" stroke="#315CFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="477" y="214" text-anchor="middle" font-family="Inter,Manrope,Arial,sans-serif" font-size="12" font-weight="750" fill="#315CFF">YES</text><rect x="527" y="184" width="198" height="95" rx="14" fill="#EDF2FF" stroke="#91A9FF" stroke-width="1.5"/><text x="626" y="219" text-anchor="middle" font-family="Inter,Manrope,Arial,sans-serif" font-size="17" font-weight="750" fill="#17191C">Visit information</text><text x="626" y="245" text-anchor="middle" font-family="Inter,Manrope,Arial,sans-serif" font-size="13" font-weight="450" fill="#5E687A">Hours · Address</text><path d="M726 232 L800 232" stroke="#315CFF" stroke-width="2.5" fill="none"/><path d="M794 226 L800 232 L794 238" fill="none" stroke="#315CFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="800" y="184" width="188" height="95" rx="14" fill="#315CFF" stroke="#315CFF" stroke-width="1.5"/><text x="894" y="219" text-anchor="middle" font-family="Inter,Manrope,Arial,sans-serif" font-size="17" font-weight="750" fill="#fff">Get Directions</text><text x="894" y="245" text-anchor="middle" font-family="Inter,Manrope,Arial,sans-serif" font-size="13" font-weight="450" fill="#e5ebff">Primary action</text><path d="M988 232 L1040 232" stroke="#315CFF" stroke-width="2.5" fill="none"/><path d="M1034 226 L1040 232 L1034 238" fill="none" stroke="#315CFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1040" y="184" width="136" height="95" rx="14" fill="#FFFFFF" stroke="#DCE3EF" stroke-width="1.5"/><text x="1108" y="219" text-anchor="middle" font-family="Inter,Manrope,Arial,sans-serif" font-size="17" font-weight="750" fill="#17191C">Google</text><text x="1108" y="242" text-anchor="middle" font-family="Inter,Manrope,Arial,sans-serif" font-size="17" font-weight="750" fill="#17191C">Maps ↗</text><path d="M355 297 L355 356" stroke="#315CFF" stroke-width="2.5" fill="none"/><path d="M349 350 L355 356 L349 362" fill="none" stroke="#315CFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="374" y="329" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="12" font-weight="750" fill="#315CFF">NO</text><rect x="257" y="356" width="197" height="85" rx="14" fill="#FFFFFF" stroke="#DCE3EF" stroke-width="1.5"/><text x="355" y="386" text-anchor="middle" font-family="Inter,Manrope,Arial,sans-serif" font-size="17" font-weight="750" fill="#17191C">Explore Menu</text><text x="355" y="411" text-anchor="middle" font-family="Inter,Manrope,Arial,sans-serif" font-size="13" font-weight="450" fill="#5E687A">Browse food</text><path d="M455 399 L565 399" stroke="#315CFF" stroke-width="2.5" fill="none"/><path d="M559 393 L565 399 L559 405" fill="none" stroke="#315CFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="565" y="356" width="209" height="85" rx="14" fill="#FFFFFF" stroke="#DCE3EF" stroke-width="1.5"/><text x="669" y="385" text-anchor="middle" font-family="Inter,Manrope,Arial,sans-serif" font-size="17" font-weight="750" fill="#17191C">Choose category</text><text x="669" y="411" text-anchor="middle" font-family="Inter,Manrope,Arial,sans-serif" font-size="13" font-weight="450" fill="#5E687A">Preview items</text><path d="M775 399 L894 399" stroke="#315CFF" stroke-width="2.5" fill="none"/><path d="M894 399 L894 280" stroke="#315CFF" stroke-width="2.5" fill="none"/><path d="M888 274 L894 280 L888 286" fill="none" stroke="#315CFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="814" y="383" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="12" font-weight="750" fill="#315CFF">Return to CTA</text><text x="44" y="488" text-anchor="start" font-family="Inter,Manrope,Arial,sans-serif" font-size="12" font-weight="450" fill="#5E687A">This flow represents the intended interface behaviour, not observed user-test performance.</text></svg>