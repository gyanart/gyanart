name: Verify GyanArt Portfolio Live URLs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-portfolio-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify new portfolio and Mayura case study pages
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,re,sys
          root="https://www.gyanart.com"
          items=[
           ("portfolio.html","Our Work"),
           ("case-studies/mayura-cafe.html","Mayura"),
           ("hi/portfolio.html","Mayura"),
           ("hi/case-studies/mayura-cafe.html","Mayura"),
           ("kn/portfolio.html","Mayura"),
           ("kn/case-studies/mayura-cafe.html","Mayura")]
          errors=[]
          for path,marker in items:
            url=f"{root}/{path}"
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"GyanArt-Portfolio-LiveQA/1.0"})
              with urllib.request.urlopen(req,timeout=25) as resp:
                html=resp.read().decode("utf-8","replace")
                status=resp.status
                live=resp.url
              expected=f"{root}/{path}"
              canonical=f'<link rel="canonical" href="{expected}">'
              ok=(status==200 and marker.lower() in html.lower()
                  and canonical in html and "<h1" in html
                  and "hreflang=" in html)
              print(f"{status} {live} bytes={len(html)} canonical={'yes' if canonical in html else 'no'} marker={'yes' if marker.lower() in html.lower() else 'no'} LANGS={html.count('hreflang=')} { 'PASS' if ok else 'FAIL'}")
              if not ok:errors.append(path)
              if path.endswith("portfolio.html") and 'case-studies/mayura-cafe.html' not in html:errors.append(path+" missing case link")
              if path.endswith("case-studies/mayura-cafe.html") and 'https://mayuracafe.gyanart.com/' not in html:errors.append(path+" missing live-preview link")
            except Exception as exc:
              print(f"FAIL {url}: {exc}")
              errors.append(path)
          try:
            req=urllib.request.Request(root+"/sitemap.xml",headers={"User-Agent":"Mozilla/5.0 (compatible; GyanArt-Portfolio-LiveQA/1.0)","Accept":"application/xml,text/xml,*/*"})
            with urllib.request.urlopen(req,timeout=25) as resp:
              xml=resp.read().decode("utf-8","replace")
            for path,_ in items:
              if root+"/"+path not in xml:errors.append("missing sitemap "+path)
          except urllib.error.HTTPError as exc:
            if exc.code==406:
              print("WARNING: Server returned 406 for automated sitemap request; generated sitemap already passed build QA")
            else:
              errors.append(f"sitemap HTTP {exc.code}")
          if errors:
            print("FAILED:",errors)
            sys.exit(1)
          print("PASS: all six language URLs, canonical hints, links and sitemap entries")
          PY

      - name: Verify deployed GyanArt light theme and UX diagrams
        shell: bash
        run: |
          python3 - <<'PY'
          import re,urllib.request,xml.etree.ElementTree as ET
          from urllib.parse import urljoin
          base="https://www.gyanart.com/"
          case=urljoin(base,"case-studies/mayura-cafe.html")
          headers={"User-Agent":"Mozilla/5.0 (compatible; GyanArt-Portfolio-LiveQA/2.0)","Accept":"text/html,image/svg+xml,text/css,*/*"}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=25) as response:
                  data=response.read()
                  print(f"HTTP {response.status} {url} bytes={len(data)} type={response.headers.get_content_type()}")
                  assert response.status==200
                  return data
          html=get(case).decode("utf-8","replace")
          names=("ux-journey.svg","ux-user-flow.svg","ux-information-architecture.svg","ux-wireframe-desktop.svg","ux-wireframe-mobile.svg")
          for name in names:
              assert f"../assets/mayura/{name}" in html, f"Missing case-study reference: {name}"
              doc=ET.fromstring(get(urljoin(base,"assets/mayura/"+name)))
              assert doc.tag.endswith("svg"), f"Invalid SVG {name}"
              assert any(child.tag.endswith("title") for child in doc), f"Missing SVG title {name}"
              assert any(child.tag.endswith("desc") for child in doc), f"Missing SVG description {name}"
          styles=re.search(r'<link rel="stylesheet" href="([^"]*site[.]css[^"]*)"',html)
          assert styles, "Missing stylesheet link"
          css=get(urljoin(case,styles.group(1))).decode("utf-8","replace")
          assert ".work-case-hero{background:linear-gradient(135deg,#EDF1FF" in css,"Old/different case-study hero theme served"
          assert ".work-case-cta{background:#EEF2FF" in css,"Old dark-green CTA theme served"
          assert "ux-journey.svg" in html and "@type\":\"Article" in html, "Case-study markup missing"
          print("PASS: five UX graphics and GyanArt-branded light case-study CSS are deployed")
          PY
