name: Verify live Turnstile activation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-turnstile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-turnstile-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live configuration, forms and missing-token rejection
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          BASE = "https://www.gyanart.com"
          ua = {"User-Agent": "Mozilla/5.0 (compatible; GyanArt-Form-QA/1.0)",
                "Cache-Control": "no-cache"}
          def request(url, data=None, content_type=None):
              headers = dict(ua)
              if content_type:
                  headers["Content-Type"] = content_type
                  headers["Accept"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=25) as res:
                      return res.status, res.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as error:
                  return error.code, error.read().decode("utf-8", "replace")

          status, body = request(BASE+"/submit-form.php?turnstile_config=1")
          assert status == 200, "Turnstile config endpoint HTTP status is not 200"
          config = json.loads(body)
          assert config.get("enabled") is True, "Turnstile has not been activated on the live server"
          assert isinstance(config.get("siteKey"), str) and len(config["siteKey"]) > 10, "Public site key is missing"
          assert "secret" not in body.lower(), "Secret field must not be exposed"
          print("PASS: live Turnstile configuration enabled; public site key available (not logged).")

          paths = ("/contact.html", "/growth-audit.html", "/starter-website-offer.html",
                   "/hi/contact.html", "/kn/contact.html", "/hi/growth-audit.html", "/kn/growth-audit.html")
          for path in paths:
              status, body = request(BASE+path)
              assert status == 200, f"{path} is not HTTP 200: {status}"
              assert 'data-email-form' in body and 'submit-form.php' in body, f"{path} missing expected enquiry form"
              print(f"PASS: {path} publishes an enquiry form.")

          # Deliberately omit the Turnstile token, and label this automated test.
          # Exactly ONE synthetic request; it must be rejected before any email.
          form = urllib.parse.urlencode({
              "form_type": "contact",
              "name": "Automated Turnstile Security Test",
              "mobile": "0000000000",
              "email": "turnstile-security-test@example.invalid",
              "message": "AUTOMATED SECURITY TEST: missing token should never send any email",
          }).encode("ascii")
          status, body = request(BASE+"/submit-form.php", form, "application/x-www-form-urlencoded")
          assert status == 422, f"Missing-token POST should return 422, instead HTTP {status}"
          response = json.loads(body)
          assert response.get("success") is False, "Server must reject tokenless submission"
          assert "verification" in str(response.get("message", "")).lower(), "Turnstile-specific error not returned"
          print("PASS: production PHP rejects tokenless enquiry with HTTP 422 before mail.")

          # Verify published JS includes the activation and challenge logic.
          status, body = request(BASE+"/js/main.js")
          assert status == 200, "Public main.js not available"
          assert "turnstile_config=1" in body and "turnstile.render" in body, "Live JS lacks Turnstile initialization"
          print("PASS: Live JavaScript includes Cloudflare Turnstile form integration.")
          PY
