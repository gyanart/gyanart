name: 🚀 Deploy Website via FTP

on:
  push:
    branches:
      - main  # 👈 Change this to "master" if your default branch is master

jobs:
  web-deploy:
    name: 🎉 Sync Files to Server
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the latest code from your repository
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # Step 2: Upload files via FTP with timeout protection
      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # Your server configuration
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          
          # Optional: Target sub-folder on your hosting server (e.g., /public_html/)
          # server-dir: ./ 

          # 🛠️ TIMEOUT & SECURITY FIXES BELOW 🛠️
          protocol: ftp          # Forces plain FTP instead of failing on explicit FTPS
          port: 21               # Standard FTP port
          security: loose        # Prevents timeout drops caused by strict SSL/TLS handshake rules
          timeout: 190000        # Extends FTP response wait time to 190 seconds (in milliseconds)
          log-level: verbose     # Provides detailed execution logs if it stops again
