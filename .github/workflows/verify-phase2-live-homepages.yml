name: Verify Phase 2 live homepages

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-phase2-live-homepages.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-phase2-live-homepages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-homepage-check:
    name: Check published EN/HI/KN buyer information
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check real HTTPS response, SEO head and Step 2 copy
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import sys
          import time
          import urllib.error
          import urllib.request

          checks = [
              ("en", "https://www.gyanart.com/", "A clearer website first. Local search support when it helps."),
              ("hi", "https://www.gyanart.com/hi/", "वेबसाइट डिज़ाइन और स्थानीय खोज"),
              ("kn", "https://www.gyanart.com/kn/", "ವೆಬ್‌ಸೈಟ್ ವಿನ್ಯಾಸ ಮತ್ತು ಸ್ಥಳೀಯ ಹುಡುಕಾಟ"),
          ]
          errors = []
          for language, url, marker in checks:
              print(f"Testing {language}: {url}", flush=True)
              html = None
              for attempt in range(1, 4):
                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0 (compatible; GyanArt-Live-SEO-QA/1.0)",
                          "Accept": "text/html,application/xhtml+xml",
                          "Cache-Control": "no-cache",
                      },
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          data = response.read()
                          status = response.status
                          charset = response.headers.get_content_charset() or "utf-8"
                          html = data.decode(charset, errors="replace")
                      print(f"HTTP {status}; {len(data)} bytes", flush=True)
                      break
                  except (urllib.error.URLError, TimeoutError) as exc:
                      print(f"Attempt {attempt} failed: {exc}", flush=True)
                      if attempt < 3:
                          time.sleep(3)
              if html is None:
                  errors.append(f"{url}: HTTPS response unavailable")
                  continue
              expected = [
                  ("Step 2 buyer copy", marker),
                  ("canonical", f'<link rel="canonical" href="{url}">'),
                  ("document language", f'<html lang="{language}">'),
                  ("pricing link", 'href="pricing.html"'),
                  ("website design link", 'href="website-design.html"'),
                  ("audit/enquiry link", 'href="growth-audit.html"'),
                  ("Mayura case study link", 'href="case-studies/mayura-cafe.html"'),
              ]
              for lang in ("en", "hi", "kn", "x-default"):
                  expected.append((f"hreflang {lang}", f'hreflang="{lang}"'))
              for label, value in expected:
                  if value not in html:
                      errors.append(f"{url}: missing {label}")
              h1s = re.findall(r"<h1(?:\s[^>]*)?>", html, flags=re.IGNORECASE)
              if len(h1s) != 1:
                  errors.append(f"{url}: expected one H1, found {len(h1s)}")
              print(f"Checked copy, canonical, links, hreflang and H1: {language}", flush=True)

          if errors:
              print("\nLive site errors or WAF blocks:", flush=True)
              for error in errors:
                  print("- " + error, flush=True)
              sys.exit(1)
          print("PASS: Live EN/HI/KN homepages serve Step 2 buyer content and expected SEO/navigation markers.")
          PY
