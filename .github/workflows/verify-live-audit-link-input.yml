name: Verify published Growth Audit URL field

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-audit-link-input.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-published-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check English Hindi Kannada URLs and current JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request

          base="https://www.gyanart.com"
          paths=[
              "/growth-audit.html",
              "/hi/growth-audit.html",
              "/kn/growth-audit.html",
          ]
          for path in paths:
              req=urllib.request.Request(
                  base+path,
                  headers={"User-Agent":"Mozilla/5.0 (compatible; GyanArt-Live-QA/1.0)",
                           "Cache-Control":"no-cache"}
              )
              with urllib.request.urlopen(req,timeout=22) as response:
                  content=response.read().decode("utf-8","replace")
                  status=response.status
              assert status==200, f"{path}: unexpected HTTP status {status}"
              assert 'name="website" type="text" inputmode="url"' in content, f"{path}: old input is still published"
              assert 'data-normalize-website' in content, f"{path}: URL normalization marker missing"
              assert 'name="form_type" value="audit"' in content, f"{path}: audit form missing"
              assert 'name="website_confirm"' in content, f"{path}: honeypot missing"
              print(f"PASS: {path} is live with relaxed URL input and honeypot (HTTP {status}).")
          req=urllib.request.Request(base+"/js/main.js",headers={"Cache-Control":"no-cache"})
          with urllib.request.urlopen(req,timeout=22) as response:
              js=response.read().decode("utf-8","replace")
          assert "normalizeWebsiteLink" in js and "normalizeAuditWebsite()" in js, "Live JS is not yet deployed"
          assert "turnstile_config=1" in js, "Existing Turnstile integration missing"
          print("PASS: Live JavaScript normalizes domains and retains Turnstile.")
          PY
