name: Deploy Website via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build and deploy preview to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build static website for preview
        run: PREVIEW_BUILD=true npm run build

      - name: Verify generated website
        run: |
          test -f dist/index.html
          test -f dist/css/site.css
          test -f dist/js/main.js
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/submit-form.php
          echo "Build output and PHP form handler verified."

      - name: Upload generated website to preview directory
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # FTP account root is restricted to public_html/gyanart_v1/.
          server-dir: /
