name: Deploy Website via FTP
# Redeploy check: FTP account root should map to public_html.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build and deploy production site to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build static website for production
        run: npm run build

      - name: Verify generated website
        shell: bash
        run: |
          set -euo pipefail
          check() {
            if "$@"; then
              echo "PASS: $*"
            else
              echo "::error::FAILED CHECK: $*"
              exit 1
            fi
          }

          check test -f dist/index.html
          check test -f dist/css/site.css
          check test -f dist/js/main.js
          check test -f dist/robots.txt
          check test -f dist/sitemap.xml
          check test -f dist/submit-form.php
          check test -f dist/assets/og-gyanart.svg
          check grep -q 'og:image' dist/index.html
          check grep -q 'twitter:card.*summary_large_image' dist/index.html
          check grep -q 'Cache-Control' dist/.htaccess
          check grep -q 'mod_expires.c' dist/.htaccess
          check grep -q 'mod_deflate.c' dist/.htaccess
          check grep -q 'site.css?v=' dist/index.html
          check grep -q 'main.js?v=' dist/index.html
          check grep -q 'G-D0JCS746B6' dist/index.html
          check grep -q 'G-D0JCS746B6' dist/how-it-works.html
          check grep -q 'yxvmsm9pma' dist/index.html
          check grep -q 'www.clarity.ms/tag/' dist/index.html
          check grep -q 'yxvmsm9pma' dist/how-it-works.html
          check grep -q 'www.clarity.ms/tag/' dist/how-it-works.html
          check grep -q 'generate_lead' dist/js/main.js
          check grep -q 'contact_click' dist/js/main.js
          check grep -q 'contact_method:"whatsapp"' dist/js/main.js
          check grep -q 'contact_method:"phone"' dist/js/main.js
          check grep -q 'contact_method:"email"' dist/js/main.js
          check grep -q 'Google Analytics 4 (GA4)' dist/privacy-policy.html
          check grep -q 'site-toast' dist/css/site.css
          check grep -q 'showFormToast' dist/js/main.js
          check grep -q 'form_started_at' dist/contact.html
          check grep -q 'website_confirm' dist/contact.html
          check grep -q 'form_started_at' dist/growth-audit.html
          check grep -q 'website_confirm' dist/growth-audit.html
          check grep -q 'rate_limit_passes' dist/submit-form.php
          check grep -q 'website_confirm' dist/submit-form.php
          check grep -q 'form_started_at' dist/submit-form.php
          echo "All generated-site checks passed."

      - name: Upload generated website to FTP account root (public_html)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /
