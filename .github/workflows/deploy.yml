name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - main  # Triggers deployment whenever you push to the main branch

jobs:
  web-deploy:
    name: Deploy Website
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    # OPTIONAL: If your project requires a build step (like React, Vue, or Tailwind), uncomment the lines below:
    # - name: Install Dependencies & Build
    #   run: |
    #     npm install
    #     npm run build

    - name: Upload files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # If you defined the exact target folder in Step 1, leave server-dir as "./"
        server-dir: ./ 
