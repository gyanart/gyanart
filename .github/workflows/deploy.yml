name: 🚀 Deploy GyanArt to cPanel

on:
  push:
    branches:
      - main  # Change to "master" if your primary branch uses that name

jobs:
  web-deploy:
    name: 🎉 Sync Files via FTP
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
        
      - name: 📂 Sync files to cPanel
        uses: SamKirkland/FTP-Deploy-Action@4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # server-dir: ./   # Optional: defaults to the root of the FTP directory path setup in cPanel
