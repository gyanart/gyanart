name: Deploy Website via FTP
# Redeploy check: FTP account root should map to public_html.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build and deploy production site to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build static website for production
        run: npm run build

      - name: Verify generated website
        run: |
          test -f dist/index.html
          test -f dist/css/site.css
          test -f dist/js/main.js
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/submit-form.php
          echo "Production build output and PHP form handler verified."

      - name: Upload generated website to FTP account root (public_html)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /
