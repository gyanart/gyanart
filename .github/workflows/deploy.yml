name: Deploy Website via FTP
# Redeploy check: FTP account root should map to public_html.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build and deploy production site to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build static website for production
        run: npm run build

      - name: Verify generated website
        shell: bash
        run: |
          set -euo pipefail
          check() {
            if "$@"; then
              echo "PASS: $*"
            else
              echo "::error::FAILED CHECK: $*"
              exit 1
            fi
          }

          check test -f dist/index.html
          check test -f dist/css/site.css
          check test -f dist/js/main.js
          check test -f dist/robots.txt
          check test -f dist/sitemap.xml
          check grep -q 'https://www.gyanart.com/' dist/robots.txt
          check grep -q 'https://www.gyanart.com/' dist/sitemap.xml
          check grep -q 'rel="canonical" href="https://www.gyanart.com/' dist/index.html
          check grep -q 'https://www.gyanart.com%{REQUEST_URI}' dist/.htaccess
          check grep -Fq 'RewriteRule ^index\.(html|htm)$ https://www.gyanart.com/ [R=301,L,NC]' dist/.htaccess
          check grep -Fq 'RewriteRule ^website_design\.htm$ https://www.gyanart.com/website-design.html [R=301,L,NC]' dist/.htaccess
          check grep -Fq 'RewriteRule ^website-design/?$ https://www.gyanart.com/website-design.html [R=301,L,NC]' dist/.htaccess
          check grep -Fq 'RewriteRule ^logo_design\.htm$ https://www.gyanart.com/logo-design.html [R=301,L,NC]' dist/.htaccess
          check grep -Fq 'RewriteRule ^about-us\.html$ https://www.gyanart.com/about.html [R=301,L,NC]' dist/.htaccess
          check grep -Fq 'RewriteRule ^website-design-portfolio\.html$ https://www.gyanart.com/website-design.html [R=301,L,NC]' dist/.htaccess
          check grep -Fq 'RewriteRule ^testimonials\.html$ - [G,L]' dist/.htaccess
          check grep -q 'Website design FAQs' dist/website-design.html
          check grep -q 'Google Business Profile FAQs' dist/google-business-profile-optimization.html
          check grep -q 'Explore GyanArt services' dist/insights.html
          check test -f dist/logo-design.html
          check test -f dist/faqs.html
          check test -f dist/kn/logo-design.html
          check test -f dist/hi/logo-design.html
          check test -f dist/kn/faqs.html
          check test -f dist/hi/faqs.html
          check test -f dist/kn/dental-clinics.html
          check test -f dist/hi/dental-clinics.html
          check test -f dist/kn/privacy-policy.html
          check test -f dist/hi/privacy-policy.html
          check test -f dist/kn/terms-and-conditions.html
          check test -f dist/hi/terms-and-conditions.html
          check test -f dist/kn/experiments/dental-clinic.html
          check test -f dist/hi/experiments/dental-clinic.html

          check test -f dist/kn/logo-design.html
          check test -f dist/hi/logo-design.html
          check test -f dist/kn/faqs.html
          check test -f dist/hi/faqs.html
          check test -f dist/kn/privacy-policy.html
          check test -f dist/hi/privacy-policy.html
          check test -f dist/kn/terms-and-conditions.html
          check test -f dist/hi/terms-and-conditions.html
          check grep -q 'https://www.gyanart.com/kn/logo-design.html' dist/sitemap.xml
          check grep -q 'https://www.gyanart.com/hi/logo-design.html' dist/sitemap.xml
          check grep -q 'https://www.gyanart.com/kn/dental-clinics.html' dist/sitemap.xml
          check grep -q 'https://www.gyanart.com/hi/dental-clinics.html' dist/sitemap.xml
          check test -f dist/kn/experiments/professional-services.html
          check test -f dist/hi/experiments/professional-services.html
          check test -f dist/kn/experiments/appliance-repair.html
          check test -f dist/hi/experiments/appliance-repair.html
          check test -f dist/kn/experiments/restaurant.html
          check test -f dist/hi/experiments/restaurant.html
          check grep -q 'faqs.html' dist/sitemap.xml
          check grep -q 'href="faqs.html"' dist/index.html
          check grep -q 'logo-design.html' dist/sitemap.xml
          check grep -q 'Logo Design' dist/solutions.html
          check test -f dist/submit-form.php
          check test -f dist/assets/og-gyanart.svg
          check grep -q 'og:image' dist/index.html
          check grep -q 'twitter:card.*summary_large_image' dist/index.html
          check grep -q 'Cache-Control' dist/.htaccess
          check grep -q 'mod_expires.c' dist/.htaccess
          check grep -q 'mod_deflate.c' dist/.htaccess
          check grep -q 'site.css?v=' dist/index.html
          check grep -q 'main.js?v=' dist/index.html
          check grep -q 'G-D0JCS746B6' dist/index.html
          check grep -q 'G-D0JCS746B6' dist/how-it-works.html
          check grep -q 'yxvmsm9pma' dist/index.html
          check grep -q 'www.clarity.ms/tag/' dist/index.html
          check grep -q 'yxvmsm9pma' dist/how-it-works.html
          check grep -q 'www.clarity.ms/tag/' dist/how-it-works.html
          check grep -q 'generate_lead' dist/js/main.js
          check grep -q 'contact_click' dist/js/main.js
          check grep -q 'contact_method:"whatsapp"' dist/js/main.js
          check grep -q 'contact_method:"phone"' dist/js/main.js
          check grep -q 'contact_method:"email"' dist/js/main.js
          check grep -q 'Google Analytics 4 (GA4)' dist/privacy-policy.html
          check grep -q 'site-toast' dist/css/site.css
          check grep -q 'showFormToast' dist/js/main.js
          check grep -q 'form_started_at' dist/contact.html
          check grep -q 'website_confirm' dist/contact.html
          check grep -q 'form_started_at' dist/growth-audit.html
          check grep -q 'website_confirm' dist/growth-audit.html
          check grep -q 'rate_limit_passes' dist/submit-form.php
          check grep -q 'website_confirm' dist/submit-form.php
          check grep -q 'form_started_at' dist/submit-form.php
          echo "All generated-site checks passed."

      - name: Upload generated website to FTP account root (public_html)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /
