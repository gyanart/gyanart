name: Deploy Website via FTP
# Redeploy check: FTP account root should map to public_html.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build and deploy production site to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build static website for production
        run: npm run build

      - name: Verify generated website
        run: |
          test -f dist/index.html
          test -f dist/css/site.css
          test -f dist/js/main.js
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/submit-form.php
          grep -q 'Cache-Control' dist/.htaccess
          grep -q 'mod_expires.c' dist/.htaccess
          grep -q 'mod_deflate.c' dist/.htaccess
          grep -q 'site.css?v=' dist/index.html
          grep -q 'main.js?v=' dist/index.html
          grep -q 'G-D0JCS746B6' dist/index.html
          grep -q 'G-D0JCS746B6' dist/how-it-works.html
          echo "GA4 measurement ID verified in homepage and inner-page HTML."
          grep -n 'G-D0JCS746B6' dist/index.html
          grep -q 'generate_lead' dist/js/main.js
          grep -q 'contact_click' dist/js/main.js
          grep -q 'contact_method:"whatsapp"' dist/js/main.js
          grep -q 'contact_method:"phone"' dist/js/main.js
          grep -q 'contact_method:"email"' dist/js/main.js
          grep -q 'Google Analytics 4 (GA4)' dist/privacy-policy.html
          grep -q 'generate_lead' dist/privacy-policy.html
          grep -q 'contact_click' dist/privacy-policy.html
          echo "GA4 tag, lead/contact events, privacy disclosure, static assets and PHP form handler verified."

      - name: Upload generated website to FTP account root (public_html)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /
